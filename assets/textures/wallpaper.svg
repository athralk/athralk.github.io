<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6fd6"/>
      <stop offset="55%" stop-color="#7fb3f0"/>
      <stop offset="100%" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb52c"/>
      <stop offset="100%" stop-color="#4f9420"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd13f"/>
      <stop offset="100%" stop-color="#5da324"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" filter="url(#soft)" opacity="0.95">
    <ellipse cx="260" cy="150" rx="140" ry="42"/>
    <ellipse cx="360" cy="130" rx="110" ry="36"/>
    <ellipse cx="180" cy="140" rx="90" ry="30"/>

    <ellipse cx="1200" cy="110" rx="160" ry="46"/>
    <ellipse cx="1320" cy="95" rx="120" ry="34"/>
    <ellipse cx="1080" cy="130" rx="100" ry="30"/>

    <ellipse cx="820" cy="70" rx="90" ry="26"/>
    <ellipse cx="900" cy="85" rx="70" ry="22"/>
  </g>

  <!-- distant hill -->
  <path d="M0,560 C300,470 500,520 800,500 C1100,480 1350,530 1600,470 L1600,900 L0,900 Z" fill="url(#hillBack)"/>

  <!-- foreground hill -->
  <path d="M0,650 C250,560 550,690 850,600 C1150,520 1400,630 1600,580 L1600,900 L0,900 Z" fill="url(#hillFront)"/>
</svg>